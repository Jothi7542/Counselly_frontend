<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Messages | Counselly Admin</title>
    <link rel="stylesheet" href="../CSS/navbar.css">
    <link rel="stylesheet" href="../CSS/CD.css">
    <style>
        .message-list {
            display: grid;
            gap: 20px;
            margin-top: 30px;
        }

        .message-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--shadow-sm);
            border-left: 5px solid var(--primary);
            transition: var(--transition);
        }

        .message-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .sender-info h3 {
            color: var(--primary);
            margin: 0;
            font-size: 1.2rem;
        }

        .sender-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 5px 0 0 0;
        }

        .message-date {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .message-content {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            font-size: 1rem;
            line-height: 1.6;
            color: #334155;
            white-space: pre-wrap;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 15px;
        }

        .status-pending {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-reviewed {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <img src="../Assets/Project_logo.png" alt="Counselly Logo">
            <h1>Counselly <span style="font-weight: 300; font-size: 0.9rem; opacity: 0.8;">Admin</span></h1>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="#">Security</a></li>
            <li><a href="#">Logs</a></li>
        </ul>
        <div class="nav-buttons" id="navButtons">
            <button class="login-btn" onclick="API.auth.logout()">Logout</button>
        </div>
    </nav>

    <!-- Core JS -->
    <script src="../JS/auth-manager.js"></script>
    <script src="../JS/api-client.js"></script>
    <script src="../JS/common.js"></script>

    <aside class="counselly-sidenav">
        <div class="counselly-brand">
            <div
                style="width: 50px; height: 50px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 1.2rem;">
                A</div>
            <div class="counselly-brand-text">
                <h2>Admin Panel</h2>
                <p>Counselly Management</p>
            </div>
        </div>
        <nav class="counselly-nav">
            <a href="./Admission_board.html" class="counselly-link">ADMISSION BOARD</a>
            <a href="./Admin_analytics.html" class="counselly-link">ANALYTICS</a>
            <a href="./Admin_broadcast.html" class="counselly-link">BROADCAST</a>
            <a href="./Admin_contact.html" class="counselly-link active">CONTACT MESSAGES</a>
        </nav>
    </aside>

    <div class="dashboard-container">
        <div class="welcome-box">
            <h2>Contact Messages</h2>
            <p style="color: var(--text-muted);">Manage and respond to inquiries from clients and visitors.</p>
        </div>

        <div id="messageList" class="message-list">
            <div style="text-align: center; padding: 50px;">
                <p style="color: var(--text-muted);">Loading messages...</p>
            </div>
        </div>
    </div>

    <!-- API & Logic -->
    <script src="../JS/auth-api.js"></script>
    <script src="../JS/admin-contact.js"></script>
</body>

</html>
