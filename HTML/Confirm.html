<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counselly Navbar</title>
    <link rel="stylesheet" href="../CSS/Confirm.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <img src="../Assets/Project_logo.png" alt="Counselly Logo">
            <h1>Counselly</h1>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="./About.html">About</a></li>
            <li><a href="./Blog.html">Blog</a></li>
            <li><a href="./Contact.html">Contact</a></li>
        </ul>
        <div class="nav-buttons" id="navButtons">
            <a class="login-btn" href="./auth.html">Login</a>
        </div>
    </nav>

    <!-- Core JS -->
    <script src="../JS/auth-manager.js"></script>
    <script src="../JS/api-client.js"></script>
    <script src="../JS/common.js"></script>
    <script src="../JS/booking-manager.js"></script>

    <h1 class="final">Booking Confirmed!</h1>
    <!-- EmailJS Integration -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="../JS/email-service.js"></script>

    <!-- API Definitions -->
    <script src="../JS/appointment-api.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const bookingId = localStorage.getItem("last_booking_id");
            document.getElementById("bookingId").innerText = bookingId || "N/A";
            const doctorName = localStorage.getItem("last_doctor") || "N/A";
            const bookingDate = localStorage.getItem("last_date") || "N/A";
            const bookingTime = localStorage.getItem("last_time") || "N/A";

            document.getElementById("doctorName").innerText = doctorName;
            document.getElementById("bookingDate").innerText = bookingDate;
            document.getElementById("bookingTime").innerText = bookingTime;

            // Trigger Email Notification via EmailJS
            if (bookingId && typeof EmailService !== 'undefined') {
                try {
                    console.log("Triggering EmailJS notification for booking:", bookingId);
                    const user = UserManager.get();
                    await EmailService.sendBookingNotification({
                        bookingId: bookingId,
                        doctorName: doctorName,
                        date: bookingDate,
                        time: bookingTime,
                        clientName: user ? user.name : "Client",
                        clientEmail: user ? user.email : null
                    });
                    
                    // Show a small subtle notice
                    const confirmBox = document.querySelector('.confirm-box');
                    const emailNotice = document.createElement('p');
                    emailNotice.innerHTML = "📧 <small>Confirmation email has been sent via EmailJS.</small>";
                    emailNotice.style.cssText = "color: #059669; margin-top: 15px; font-size: 0.85rem; border-top: 1px solid #eee; padding-top: 10px;";
                    confirmBox.appendChild(emailNotice);
                } catch (err) {
                    console.error("Failed to trigger EmailJS notification:", err);
                }
            }

            // Clear booking state
            localStorage.removeItem("booking_step1");
            localStorage.removeItem("booking_step2");
        });
    </script>
</body>

</html>
