    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const user = UserManager.get();
            if (!user || user.role !== 'counsellor') return;

            try {
                const sessions = await API.counsellors.getCompletedSessions(user.counsellors_id);
                const totalEarnings = sessions.length * 800; // Assuming 800 per session
                const thisMonth = sessions.filter(s => {
                    const d = new Date(s.date);
                    return d.getMonth() === new Date().getMonth();
                }).length * 800;

                document.querySelectorAll(".stat-box p")[0].innerText = `₹${totalEarnings}`;
                document.querySelectorAll(".stat-box p")[1].innerText = `₹${thisMonth}`;
                document.querySelectorAll(".stat-box p")[2].innerText = `₹${Math.floor(totalEarnings * 0.15)}`;

                const tbody = document.querySelector("table tbody");
                if (sessions.length > 0) {
                    tbody.innerHTML = sessions.map(s => `
                        <tr>
                            <td>#SESS-${s.appointment_id}</td>
                            <td>${new Date(s.date).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</td>
                            <td>₹800</td>
                            <td><span class="status-badge status-completed">Completed</span></td>
                            <td>${s.date}</td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error("Failed to load earnings:", err);
            }
        });
    </script>
