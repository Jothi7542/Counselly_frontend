<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Activity Logs | Counselly Admin</title>
    <link rel="stylesheet" href="../CSS/navbar.css">
    <link rel="stylesheet" href="../CSS/CD.css">
    <link rel="stylesheet" href="../CSS/Admin.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <img src="../Assets/Project_logo.png" alt="Counselly Logo">
            <h1>Counselly <span style="font-weight: 300; font-size: 0.9rem; opacity: 0.8;">Admin</span></h1>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="./Admin_security.html">Security</a></li>
            <li><a href="./Admin_logs.html" class="active">Logs</a></li>
        </ul>
        <div class="nav-buttons" id="navButtons">
            <button class="login-btn" onclick="API.auth.logout()">Logout</button>
        </div>
    </nav>

    <!-- Core JS -->
    <script src="../JS/auth-manager.js"></script>
    <script src="../JS/api-client.js"></script>
    <script src="../JS/common.js"></script>

    <aside class="counselly-sidenav">
        <div class="counselly-brand">
            <div class="avatar-circle-init">
                A</div>
            <div class="counselly-brand-text">
                <h2>Admin Panel</h2>
                <p>Counselly Management</p>
            </div>
        </div>
        <nav class="counselly-nav">
            <a href="./Admission_board.html" class="counselly-link">ADMISSION BOARD</a>
            <a href="./Admin_analytics.html" class="counselly-link">ANALYTICS</a>
            <a href="./Admin_broadcast.html" class="counselly-link">BROADCAST</a>
            <a href="./Admin_contact.html" class="counselly-link">CONTACT MESSAGES</a>
        </nav>
    </aside>

    <div class="dashboard-container">
        <div class="welcome-box">
            <h2>System Activity Logs</h2>
            <p style="color: var(--text-muted);">Monitor all administrative actions and system events in real-time.</p>
        </div>

        <div class="logs-container">
            <div class="filter-bar">
                <input type="text" class="search-box" placeholder="Search by event or user...">
                <div>
                    <select id="levelFilter">
                        <option value="all">All Levels</option>
                        <option value="info">Info</option>
                        <option value="warning">Warning</option>
                        <option value="error">Error</option>
                    </select>
                    <button class="refresh-btn" onclick="location.reload()">Refresh Logs</button>
                </div>
            </div>

            <table class="log-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Level</th>
                        <th>Event</th>
                        <th>User</th>
                        <th>IP Address</th>
                    </tr>
                </thead>
                <tbody id="logBody">
                    <!-- Logs will be loaded here -->
                    <tr>
                        <td colspan="5" style="text-align:center; padding: 40px; color: var(--text-muted);">Fetching
                            activity logs...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- API & Logic -->
    <script src="../JS/auth-api.js"></script>
    <script src="../JS/admin-logs.js"></script>
</body>

</html>
